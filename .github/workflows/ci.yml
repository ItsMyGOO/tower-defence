name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

env:
  GODOT_VERSION: 4.6.1-stable

jobs:
  build-and-test:
    name: 编译 + 塔行为测试 (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 还原 .NET 本地工具
        run: dotnet tool restore

      - name: 编译（错误即失败）
        run: dotnet build --nologo

      - name: 缓存 Godot headless 运行时
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: 下载 Godot headless 运行时
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot_extract
          mv /tmp/godot_extract/Godot_v${GODOT_VERSION}_mono_linux_x86_64/* godot/

      - name: 导入资源（生成 .godot 缓存）
        run: |
          godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . --import

      - name: 运行塔行为测试（退出码 0 = 全部通过）
        run: |
          chmod +x godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64
          godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64 \
            --headless --path . res://Tests/Scenes/TowerBehaviorTest/TowerBehaviorTest.tscn

      - name: 运行设置系统测试（退出码 0 = 全部通过）
        run: |
          godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64 \
            --headless --path . res://Tests/Scenes/SettingsTest/SettingsTest.tscn

      - name: 运行 GameManager 测试（退出码 0 = 全部通过）
        run: |
          godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64 \
            --headless --path . res://Tests/Scenes/GameManagerTest/GameManagerTest.tscn

      - name: 运行 HUD/UI 测试（退出码 0 = 全部通过）
        run: |
          godot/Godot_v${GODOT_VERSION}_mono_linux.x86_64 \
            --headless --path . res://Tests/Scenes/UITest/UITest.tscn
